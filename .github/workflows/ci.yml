name: Compiler-Guided Neural Fuzzing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: LLVM Pass Build & Static Analysis Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & LLVM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang libclang-dev make gcc g++ python3-matplotlib

      - name: Compile Standalone LLVM IR Constraint Extractor
        run: |
          cd fuzz_lab4_llvm_pass
          clang++ -O3 constraint_extractor.cpp \
            $(llvm-config --cxxflags --ldflags --system-libs --libs core irreader support) \
            -o constraint_extractor
          ls -la constraint_extractor

      - name: Verify Bitcode Analysis & Constraint Extraction
        run: |
          cd fuzz_lab4_llvm_pass
          clang -O1 -emit-llvm -c target.c -o target.bc
          ./constraint_extractor target.bc
          cat extracted_constraints.json
          # Validasi bahwa JSON tidak kosong dan memiliki token yang valid
          python3 -c '
          import json
          with open("extracted_constraints.json") as f:
              d = json.load(f)
              assert len(d.get("hex_tokens", [])) > 0, "No hex tokens found!"
              assert len(d.get("extracted_integers", [])) > 0, "No integer constraints found!"
          print("[CI] LLVM Invariant extraction verification passed successfully!")
          '

      - name: Verify Tooling & Telemetry Dashboard Generation
        run: |
          python3 tools/generate_dashboard.py
          ls -lh report_dashboard.html benchmark_summary.json

      - name: Validate Python Mutators Syntax & Sanity
        run: |
          python3 -m py_compile fuzz_lab2_mutator/ai_mutator.py
          python3 -m py_compile fuzz_lab3_daemon/ai_mutator.py
          python3 -m py_compile fuzz_lab4_llvm_pass/ai_mutator.py
          python3 -m py_compile fuzz_lab5_realworld_cjson/ai_mutator.py
          python3 -m py_compile fuzz_lab6_adaptive_stagnation/ai_mutator_adaptive.py
          python3 -m py_compile tools/crash_triager.py
          python3 -m py_compile tools/generate_dashboard.py
          echo "[CI] All Python mutator modules compiled and verified cleanly."
