name: Compiler-Guided Neural Fuzzing CI

on:
  push:
    branches: [ main, master, experimental ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Polyglot Fuzzing Test Suite & Analysis Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & Toolchain
        run: |
          sudo apt-get update || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            llvm clang make gcc g++ python3-matplotlib python3-pytest || true
          pip install pytest z3-solver

      - name: Compile Java Targets
        run: |
          if [ -f "fuzz_lab24_java_jvm_harness/TargetParser.java" ]; then
            javac fuzz_lab24_java_jvm_harness/TargetParser.java
          fi

      - name: Verify Telemetry Dashboard Generation
        run: |
          python3 tools/generate_dashboard.py
          test -f report_dashboard.html
          echo "[+] Dashboard verification passed."

      - name: Execute Automated Regression Test Suite (pytest)
        run: |
          pytest -v tests/
          echo "[+] All automated unit and integration tests passed."
