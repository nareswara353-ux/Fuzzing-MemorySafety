name: Compiler-Guided Neural Fuzzing CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang make gcc g++ python3-dev python3-pytest
          pip install pytest z3-solver setuptools

      - name: Compile Polyglot Targets
        run: |
          # ... (compile commands for lab 1-70) ...
          # Lab 71 compilation
          if [ -d "fuzz_lab71_cpython_c_extension" ]; then
            cd fuzz_lab71_cpython_c_extension && python3 setup.py build_ext --inplace && cd ..
          fi

      - name: Run Tests
        run: pytest -v tests/

      - name: Generate Dashboard
        run: |
          python3 tools/generate_dashboard.py
          mkdir -p _site
          cp report_dashboard.html _site/index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
