name: Compiler-Guided Neural Fuzzing CI

on:
  push:
    branches: [ main, master, experimental ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Polyglot Fuzzing Test Suite & Analysis Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & Toolchain
        run: |
          sudo apt-get update || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            llvm clang make gcc g++ python3-matplotlib python3-pytest || true
          pip install pytest z3-solver

      - name: Compile Java & JNI Targets
        run: |
          if [ -f "fuzz_lab24_java_jvm_harness/TargetParser.java" ]; then
            javac fuzz_lab24_java_jvm_harness/TargetParser.java
          fi
          if [ -f "fuzz_lab25_java_deserialization/InsecureDeserializer.java" ]; then
            javac fuzz_lab25_java_deserialization/InsecureDeserializer.java
          fi
          if [ -f "fuzz_lab26_jni_boundary/NativeBridge.java" ]; then
            cd fuzz_lab26_jni_boundary
            javac NativeBridge.java
            gcc -shared -fPIC -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" native_lib.c -o libnative_engine.so
            cd ..
          fi
          if [ -f "fuzz_lab27_java_spel_ognl/SpelEvaluator.java" ]; then
            javac fuzz_lab27_java_spel_ognl/SpelEvaluator.java
          fi
          if [ -f "fuzz_lab28_java_xxe_bomb/XxeTargetParser.java" ]; then
            javac fuzz_lab28_java_xxe_bomb/XxeTargetParser.java
          fi
          if [ -f "fuzz_lab29_java_redos/RedosValidator.java" ]; then
            javac fuzz_lab29_java_redos/RedosValidator.java
          fi
          if [ -f "fuzz_lab30_java_sql_injection/SqlTargetRepository.java" ]; then
            javac fuzz_lab30_java_sql_injection/SqlTargetRepository.java
          fi
          if [ -f "fuzz_lab31_jvm_bytecode_agent/CoverageAgent.java" ]; then
            javac fuzz_lab31_jvm_bytecode_agent/CoverageAgent.java fuzz_lab31_jvm_bytecode_agent/TargetApp.java
          fi
          if [ -f "fuzz_lab32_java_concurrency_deadlock/ConcurrentService.java" ]; then
            javac fuzz_lab32_java_concurrency_deadlock/ConcurrentService.java
          fi
          if [ -f "fuzz_lab33_java_jwt_crypto/JwtAuthService.java" ]; then
            javac fuzz_lab33_java_jwt_crypto/JwtAuthService.java
          fi

      - name: Verify Telemetry Dashboard Generation
        run: |
          python3 tools/generate_dashboard.py
          test -f report_dashboard.html

      - name: Execute Automated Regression Test Suite (pytest)
        run: |
          pytest -v tests/
